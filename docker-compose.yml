    #   # 日志持久化
    #   volumes:
    #     - ./logs:/app/logs

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 网络模式
    network_mode: bridge

volumes:
  mysql_data:
